# The shimmer reel's edit.
#
# Shots play in order. Each lasts `beats` at `bpm` and ends in a cut into the next, centered on the
# beat where they meet; the last shot's cut fades the film out. A shimmer shot is a take: a stock
# shimmer playing a synthetic turn in the live rows around `command` and its `output`, or with
# `rows = "status"` in the status row alone. The turn starts `preroll` beats before the shot, at
# least half the cut into it; each segment works at `busy` output tokens a second, waits on a tool
# whose result adds `wait` tokens as it ends, or `reach`es a quantum total by its end. `energy`
# arranges the score under the shot: 0 pads, 1 adds the arpeggio and bass, 2 drums, 3 everything.
#
# A take in the live rows is framed `still`, slowly pushing in (`push`), `close` on the status row,
# or moving from still to close (`dolly`). Its lower third names the shimmer (`title = "name"`), adds
# its blurb and author (`"full"`), or is absent (`"none"`), when a `caption` may stand beneath it.
#
# Cuts: fade, crt, glitch, punch, melt, scan, iris, shatter, and the cell cuts flap, decrypt and
# shred, which join two shimmer shots with the same rows.

[film]
size = [1920, 1080]
fps = 60
bpm = 120
cols = 64
cell = 30
ink = [214, 214, 214]
canvas = [0, 0, 0]
glow = 0.55
fade_in = 4

[[shot]]
shimmer = "LFSR"
rows = "status"
beats = 16
energy = 0
title = "none"
caption = ["shimmers"]
preroll = 2
turn = [{ caption = "codex-1337", beats = 30, busy = 70 }]
cut = { kind = "scan", beats = 2 }

[[shot]]
shimmer = "Lava Lamp"
beats = 12
energy = 1
framing = "push"
command = "cargo build --release"
output = "Compiling ratatui v0.30.2"
timer = 74
preroll = 4
turn = [{ caption = "Warming the status row", beats = 24, busy = 60 }]
cut = { kind = "flap", beats = 2 }

[[shot]]
shimmer = "Neon"
beats = 12
energy = 1
framing = "push"
command = "rg -n tube codex-rs/tui/src"
output = "shimmers/neon.rs: 4 matches"
timer = 131
preroll = 4
turn = [{ caption = "Rewiring the sign", beats = 24, busy = 70 }]
cut = { kind = "glitch", beats = 1 }

[[shot]]
shimmer = "Rubik"
beats = 12
energy = 2
framing = "push"
command = "cargo test -p codex-tui rubik"
output = "running 2 tests"
timer = 187
preroll = 4
turn = [{ caption = "Solving the puzzle", beats = 24, busy = 80 }]
cut = { kind = "decrypt", beats = 2 }

[[shot]]
shimmer = "Cambrian"
beats = 12
energy = 2
framing = "dolly"
command = "just test -p codex-tui --lib"
output = "Compiling codex-tui v0.163.0"
timer = 242
preroll = 8
turn = [{ caption = "Evolving automaton rules", beats = 30, busy = 75 }]
cut = { kind = "melt", beats = 2 }

[[shot]]
shimmer = "Tetromino"
beats = 12
energy = 2
framing = "close"
command = "cargo run --release --bin tetris"
output = "Finished release profile"
timer = 305
preroll = 6
turn = [{ caption = "Clearing four lines", beats = 30, busy = 90 }]
cut = { kind = "crt", beats = 2 }

[[shot]]
shimmer = "Forge"
beats = 16
energy = 1
framing = "push"
command = "cargo build --release"
output = "Compiling codex-core v0.163.0"
timer = 366
preroll = 6
turn = [
  { caption = "Tempering the release", beats = 14, busy = 120 },
  { caption = "Waiting for background terminal", beats = 30, wait = 3000 },
]
cut = { kind = "punch", beats = 2 }

[[shot]]
shimmer = "Supernova"
beats = 8
energy = 3
title = "name"
command = "cargo build --release"
output = "Finished release profile [optimized]"
timer = 412
preroll = 6
turn = [
  { caption = "Igniting the build", beats = 7, reach = 279 },
  { caption = "Igniting the build", beats = 20, busy = 75 },
]
cut = { kind = "shatter", beats = 2 }

[[shot]]
shimmer = "Critter"
beats = 8
energy = 3
title = "name"
command = "cargo test -p codex-tui"
output = "test result: ok. 412 passed"
timer = 431
preroll = 4
turn = [{ caption = "Celebrating green tests", beats = 20, busy = 140 }]
cut = { kind = "flap", beats = 1 }

[[shot]]
shimmer = "Prism"
beats = 8
energy = 3
title = "name"
command = "git log --oneline -3"
output = "0eaab19 Underline the LFSR's taps"
timer = 448
preroll = 4
turn = [{ caption = "Splitting the spectrum", beats = 20, busy = 90 }]
cut = { kind = "glitch", beats = 1 }

[[shot]]
shimmer = "Turing"
beats = 8
energy = 3
title = "name"
command = "cargo run --example busy_beaver"
output = "halted after 47176870 steps"
timer = 467
preroll = 4
turn = [{ caption = "Running four machines", beats = 20, busy = 100 }]
cut = { kind = "shred", beats = 1 }

[[shot]]
shimmer = "Fireflies"
beats = 8
energy = 3
title = "name"
command = "cargo bench -p codex-tui"
output = "Benchmarking shimmer/fireflies"
timer = 485
preroll = 4
turn = [{ caption = "Syncing with output", beats = 20, busy = 110 }]
cut = { kind = "decrypt", beats = 1 }

[[shot]]
shimmer = "Sandpile"
beats = 8
energy = 3
title = "name"
command = "cargo test sandpile -- --nocapture"
output = "avalanche of 214 grains"
timer = 503
preroll = 4
turn = [{ caption = "Toppling grains", beats = 20, busy = 130 }]
cut = { kind = "iris", beats = 2 }

[[shot]]
roll = [
  "LFSR", "Lava Lamp", "Neon", "Rubik", "Cambrian", "Tetromino", "Forge",
  "Supernova", "Critter", "Prism", "Turing", "Fireflies", "Sandpile",
]
columns = 2
beats = 12
energy = 2
preroll = 4
turn = [{ beats = 40, busy = 80 }]
cut = { kind = "fade", beats = 4 }

[[shot]]
card = ["codex-1337", "shimmers by Claude Opus 5.5, DeepSeek V4.1 Flash 1017 and The User"]
beats = 8
energy = 0
cut = { kind = "fade", beats = 4 }
