[env]
# Ask compatible jemalloc processes for transparent huge pages.
# Cargo passes this to all child processes, including tests and cargo run.
# An explicit MALLOC_CONF (even empty) keeps precedence.
MALLOC_CONF = { value = "thp:always", force = false }

[build]
rustc-wrapper = "sccache"

[target.'cfg(all(target_os = "linux", target_env = "gnu"))']
linker = "clang"
# A string overrides rather than concatenates when linked worktrees inherit
# this same config through their parent directory. Never alternate linkers.
rustflags = "-C linker-features=-lld -C link-arg=-fuse-ld=mold"

[unstable]
feature-unification = true

[resolver]
# The maintained PATH cargo wrapper enables this on our pinned stable Cargo.
# Scoped checks should select work, not invent another dependency feature graph.
feature-unification = "workspace"
